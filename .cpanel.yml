---
# .cpanel.yml — dijalankan cPanel "Git Version Control" tombol "Deploy HEAD
# Commit". Sinkronin isi repo ke document root, KECUALI file yang memang
# TIDAK PERNAH boleh ikut git (config kredensial asli + folder upload).
#
# Akun cPanel: bolaupdateindonesia.com (DEPLOYPATH sudah diisi path
# docroot asli, dikonfirmasi operator dari cPanel → Domains). Repo Git
# Version Control di-clone ke /home/bolaupdateindone/repositories/
# wcm-bolaupdateindonesia.com — path terpisah, BUKAN docroot; script ini
# yang rsync isinya ke public_html saat "Deploy HEAD Commit" ditekan.
# Lihat docs/HANDOFF.md dan wcm1_version1/docs/DEPLOY_WORKFLOW.md (pola
# yang sama, situs sebelah) untuk detail lengkap alur deploy.
deployment:
  tasks:
    - export DEPLOYPATH=/home/bolaupdateindone/public_html/
    - /usr/bin/rsync -av --exclude='.git' --exclude='.cpanel.yml' --exclude='cms-admin/config/database.php' --exclude='cms-admin/config/app.php' --exclude='uploads' ./ $DEPLOYPATH
